site_name: slikui
site_description: >-
  A sleek, header-only C++ UI library for graphics applications — retained-mode
  widget tree, declarative builder API, one narrow rendering contract. Python
  bindings included.
site_url: https://jamesgregson.github.io/slikui/
repo_url: https://github.com/jamesgregson/slikui
repo_name: jamesgregson/slikui
edit_uri: edit/main/docs/

copyright: MIT licensed · stb libraries are public domain

strict: true

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    # dark default, matching the library's built-in Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-night
        name: switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: switch to dark
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Demo-code includes: docs quote extracted regions of the shipped
      # examples (tools/extract_snippets.py -> docs/includes/examples/).
      base_path: docs
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - search
  - llmstxt:
      # llms.txt (index) + llms-full.txt (entire site as markdown) at the site
      # root — machine/agent-readable entry point alongside the HTML.
      markdown_description: >-
        slikui — a header-only C++20 UI library for graphics applications,
        with first-class Python bindings. Guides and per-widget reference.
      full_output: llms-full.txt
      sections:
        Getting started:
          - getting-started/*.md
        Guides:
          - guide/*.md
        Reference:
          - reference/*.md
        Development:
          - development.md

nav:
  - Home: index.md
  - Getting started:
      - C++: getting-started/cpp.md
      - Python: getting-started/python.md
  - Guides:
      - Core concepts: guide/core-concepts.md
      - Layout: guide/layout.md
      - Input & events: guide/input-events.md
      - Text & fonts: guide/text-fonts.md
      - Theming: guide/theming.md
      - Custom widgets: guide/custom-widgets.md
      - Python examples: guide/examples.md
      - Render backends: guide/backends.md
  - Reference:
      - Widget index: reference/index.md
      - Controls: reference/widgets-controls.md
      - Text inputs: reference/widgets-inputs.md
      - Editors: reference/widgets-editors.md
      - Data display: reference/widgets-data.md
      - Containers: reference/widgets-containers.md
      - Shells & dialogs: reference/widgets-shells.md
      - Menus & toolbars: reference/widgets-menus.md
      - Context: reference/context.md
      - Python bindings: reference/python-bindings.md
      - Architecture: reference/architecture.md
  - Development: development.md

# files served from docs/ but excluded from the nav warning check
not_in_nav: |
    stylesheets/*
    includes/**
