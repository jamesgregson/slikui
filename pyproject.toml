[build-system]
requires = ["scikit-build-core>=1.1.2", "ninja>=1.11"]
build-backend = "scikit_build_core.build"

[project]
name = "slikui-python"
dynamic = ["version"]
description = "Python bindings for slikui — a header-only C++20 UI library"
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT"
# The bundled font (compiled into the extension) carries its own licence.
license-files = ["LICENSE", "third_party/fonts/LICENSE-DejaVu.txt"]
authors = [{ name = "slikui contributors" }]
dependencies = ["numpy>=1.24", "pillow>=10.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# for python/examples/glfw_demo.py (and its headless tests)
demo = ["glfw>=2.5", "PyOpenGL"]

[project.urls]
Homepage = "https://github.com/jamesgregson/slikui"
Documentation = "https://github.com/jamesgregson/slikui/tree/main/python"

[tool.scikit-build]
wheel.packages = ["python/slikui"]

# Version: single source of truth is include/slikui/version.hpp — the same
# three macros CMake and the compiled extension read.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "include/slikui/version.hpp"
regex = '''(?m)^#define SLIKUI_VERSION_MAJOR (?P<major>\d+)$\s+^#define SLIKUI_VERSION_MINOR (?P<minor>\d+)$\s+^#define SLIKUI_VERSION_PATCH (?P<patch>\d+)$'''
result = "{major}.{minor}.{patch}"

[tool.scikit-build.sdist]
exclude = [
    "third_party/nanobind/docs",
    "third_party/nanobind/.github",
    "third_party/nanobind/nanobind-backend",
    "third_party/nanobind/ext/robin_map/.git",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
