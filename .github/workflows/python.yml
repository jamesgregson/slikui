name: python

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: sdist + wheel-from-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .

      - name: build a wheel FROM the sdist
        run: |
          python -m pip wheel --no-deps -w wheelhouse dist/*.tar.gz
          python -m pip install wheelhouse/*.whl
          python -c "import slikui; print('sdist round-trip OK,', slikui.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }     # linux x86_64
          - { os: ubuntu-24.04-arm }  # linux aarch64
          - { os: macos-latest }      # macOS arm64 (no x86_64: Intel Macs build from the sdist)
          - { os: windows-latest }    # windows amd64
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      # gcc 13 on manylinux_2_28 — C++20 needs more than 2014's devtoolset
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_TEST_REQUIRES: "pytest numpy pillow"
      CIBW_TEST_COMMAND: "python -m pytest {package}/python/tests -q"
      CIBW_BUILD_VERBOSITY: 1
    steps:
      - uses: actions/checkout@v4

      - name: build + test wheels
        uses: pypa/cibuildwheel@v3.4

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Tag push (v*) -> GitHub Release with the sdist + every wheel attached;
  # the pypi job below then uploads the same files to PyPI.
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]          # every platform built and tested, or no release
    runs-on: ubuntu-latest
    permissions:
      contents: write               # create the release + upload assets
    steps:
      - uses: actions/checkout@v4

      # Not into dist/: that's the tracked folder holding the amalgamated
      # C++ headers (attached to the release explicitly below).
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true      # sdist + wheels-* -> one flat folder

      # The built files carry the version from include/slikui/version.hpp (via
      # the pyproject regex provider) in their names; the tag must agree.
      - name: tag must match package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          bad=$(ls packages | grep -v -e "^slikui_python-$v\.tar\.gz$" -e "^slikui_python-$v-.*\.whl$" || true)
          if [ ! -f "packages/slikui_python-$v.tar.gz" ] || [ -n "$bad" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the built version (include/slikui/version.hpp)"
            ls packages
            exit 1
          fi

      - name: create release
        run: |
          ls -l packages dist
          gh release create "$GITHUB_REF_NAME" packages/* dist/slikui.hpp dist/slikui_default_font.hpp \
            --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  # Tag push (v*) -> upload the same sdist + wheels to PyPI via Trusted
  # Publishing (OIDC): no stored token. PyPI must list this repo, workflow
  # python.yml and environment "pypi" as a trusted publisher for slikui-python.
  pypi:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]                # tag/version check passed, GitHub Release exists
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/slikui-python
    permissions:
      id-token: write               # mint the OIDC token PyPI exchanges for an upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true      # sdist + wheels-* -> one flat folder

      - uses: pypa/gh-action-pypi-publish@release/v1
