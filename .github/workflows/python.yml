name: python

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    name: sdist + wheel-from-sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist .

      - name: build a wheel FROM the sdist
        run: |
          python -m pip wheel --no-deps -w wheelhouse dist/*.tar.gz
          python -m pip install wheelhouse/*.whl
          python -c "import slikui; print('sdist round-trip OK,', slikui.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest }     # linux x86_64
          - { os: ubuntu-24.04-arm }  # linux aarch64
          - { os: macos-latest }      # macOS arm64
          - { os: macos-13 }          # macOS x86_64
          - { os: windows-latest }    # windows amd64
    env:
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      # gcc 13 on manylinux_2_28 — C++20 needs more than 2014's devtoolset
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_TEST_REQUIRES: "pytest numpy"
      CIBW_TEST_COMMAND: "python -m pytest {package}/python/tests -q"
      CIBW_BUILD_VERBOSITY: 1
    steps:
      - uses: actions/checkout@v4

      - name: build + test wheels
        uses: pypa/cibuildwheel@v3

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
