[build-system]
requires = ["scikit-build-core>=0.11", "ninja>=1.11"]
build-backend = "scikit_build_core.build"

[project]
name = "slikui"
version = "0.1.0"
description = "Python bindings for slikui — a header-only C++20 UI library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "slikui contributors" }]
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: C++",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
wheel.packages = ["slikui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
